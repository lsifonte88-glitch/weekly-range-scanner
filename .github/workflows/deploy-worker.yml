name: Deploy Weekly Range API
# Smart Money cache/deploy fix

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test Smart Money backtest
        shell: bash
        run: |
          set -euo pipefail
          URL="https://weekly-range-api.changowalu.workers.dev/smart-money-backtest?symbols=NVDA%2CGOOGL%2CAMD%2CAVGO%2CPLTR%2CM%2CMUU%2CAMZN%2CJD%2CWFC%2CDAL%2CGRAB%2CRKLB%2CSOFI%2CTSLA%2CINTC%2CMETA%2CUBER%2CHOOD%2CQQQM%2CSMH%2CXLF%2CIWM%2CVOO"
          RESPONSE="$(curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$URL")"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert "portfolio" in d and "results" in d, d.keys(); assert len(d["results"]) == 24, len(d["results"]); print("Smart Money backtest OK:", len(d["results"]), "symbols"); print(json.dumps(d["portfolio"], separators=(",",":")))'

      - name: Smoke test Finviz integration
        shell: bash
        run: |
          set -euo pipefail
          # Disable retries here: retries can concatenate multiple JSON bodies and hide the first response.
          RESPONSE="$(curl --retry 0 -sS "https://weekly-range-api.changowalu.workers.dev/finviz-candidates")"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); diag={"status":d.get("status"),"count":d.get("count"),"rawCount":d.get("rawCount"),"rowsWithCoreFields":d.get("rowsWithCoreFields"),"droppedRows":d.get("droppedRows"),"pagesSucceeded":d.get("pagesSucceeded"),"sampleFields":(d.get("pageDiagnostics") or [{}])[0].get("sampleFields")}; print("Finviz diagnostics:",json.dumps(diag,separators=(",",":"))); assert d.get("status")=="ok", d.get("note"); assert d.get("count",0)>=20 and d.get("rowsWithCoreFields")==d.get("count"), diag; rows=[x.get("fields") or {} for x in d.get("candidates",[])]; valid=[x for x in rows if x.get("country")=="USA" and all(isinstance(x.get(k),(int,float)) for k in ("price","changePct","volume","averageVolume","relativeVolume")) and x.get("sector") and x.get("industry")]; assert len(valid)==d.get("count"), "Unvalidated candidate fields: "+str(len(valid))+"/"+str(d.get("count")); print("Finviz parsed and validated:",len(valid),"US rows with numeric price/change/volume/averageVolume/RVOL and sector/industry.")'
