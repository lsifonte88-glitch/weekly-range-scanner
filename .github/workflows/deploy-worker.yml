name: Deploy Weekly Range API
# Smart Money cache/deploy fix

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test Smart Money backtest
        shell: bash
        run: |
          set -euo pipefail
          URL="https://weekly-range-api.changowalu.workers.dev/smart-money-backtest?symbols=NVDA%2CGOOGL%2CAMD%2CAVGO%2CPLTR%2CM%2CMUU%2CAMZN%2CJD%2CWFC%2CDAL%2CGRAB%2CRKLB%2CSOFI%2CTSLA%2CINTC%2CMETA%2CUBER%2CHOOD%2CQQQM%2CSMH%2CXLF%2CIWM%2CVOO"
          RESPONSE="$(curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$URL")"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert "portfolio" in d and "results" in d, d.keys(); assert len(d["results"]) == 24, len(d["results"]); print("Smart Money backtest OK:", len(d["results"]), "symbols"); print(json.dumps(d["portfolio"], separators=(",",":")))'

      - name: Smoke test prefilter integration
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --retry 3 --retry-delay 3 --retry-connrefused -fsS "https://weekly-range-api.changowalu.workers.dev/prefilter")"
          printf '%s' "$RESPONSE" | python -c 'import json,re,sys; d=json.load(sys.stdin); assert d.get("status")=="ok", d; symbols=d.get("symbols") or []; assert len(symbols)>=20, "Too few prefilter candidates: "+str(len(symbols)); assert d.get("yahooCount",0)>0, d; assert "Yahoo Finance" in d.get("source",""), d.get("source"); assert "Finviz" in d.get("source","") and d.get("finviz",{}).get("status")=="ok", d.get("finviz"); assert all(re.fullmatch(r"[A-Z0-9.-]+",s) and s!="MSFT" for s in symbols), "Invalid symbol in prefilter"; print("Prefilter OK:",len(symbols),"symbols; Yahoo:",d.get("yahooCount"),"; Finviz:",d.get("finviz",{}).get("count"),"; source:",d.get("source"))'

      - name: Smoke test Finviz integration
        shell: bash
        run: |
          set -euo pipefail
          # Retry stale edge responses after deployment, but parse each response separately.
          RESPONSE=""
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --retry 0 -sS "https://weekly-range-api.changowalu.workers.dev/finviz-candidates")"
            if printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if "rawCount" in d and "rowsWithCoreFields" in d else 1)' >/dev/null 2>&1; then break; fi
            if [ "$attempt" -lt 5 ]; then sleep 3; fi
          done
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); diag={"status":d.get("status"),"count":d.get("count"),"rawCount":d.get("rawCount"),"rowsWithCoreFields":d.get("rowsWithCoreFields"),"droppedRows":d.get("droppedRows"),"pagesSucceeded":d.get("pagesSucceeded"),"sampleFields":(d.get("pageDiagnostics") or [{}])[0].get("sampleFields")}; print("Finviz diagnostics:",json.dumps(diag,separators=(",",":"))); assert "rawCount" in d and "rowsWithCoreFields" in d, "Worker edge has not picked up the deployed schema"; assert d.get("status")=="ok", d.get("note"); assert d.get("count",0)>=20 and d.get("rowsWithCoreFields")==d.get("count"), diag; rows=[x.get("fields") or {} for x in d.get("candidates",[])]; valid=[x for x in rows if x.get("country")=="USA" and all(isinstance(x.get(k),(int,float)) for k in ("price","changePct","volume","averageVolume","relativeVolume")) and x.get("sector") and x.get("industry")]; assert len(valid)==d.get("count"), "Unvalidated candidate fields: "+str(len(valid))+"/"+str(d.get("count")); print("Finviz parsed and validated:",len(valid),"US rows with numeric price/change/volume/averageVolume/RVOL and sector/industry.")'
