name: Deploy Weekly Range API
# Smart Money cache/deploy fix

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test Smart Money backtest
        shell: bash
        run: |
          set -euo pipefail
          URL="https://weekly-range-api.changowalu.workers.dev/smart-money-backtest?symbols=NVDA%2CGOOGL%2CAMD%2CAVGO%2CPLTR%2CM%2CMUU%2CAMZN"
          RESPONSE="$(curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$URL")"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert "portfolio" in d and "results" in d, d.keys(); assert len(d["results"]) == 8, len(d["results"]); print("Smart Money backtest OK:", len(d["results"]), "symbols; portfolio summaries present")'
