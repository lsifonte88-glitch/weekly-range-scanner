<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Range Scanner PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#e8eef8;font-family:Arial,sans-serif}
.wrap{max-width:1450px;margin:auto;padding:24px}
h1{margin:0 0 6px;font-size:30px}
.sub{color:#8fa0b8;margin-bottom:22px}
.panel{background:#101827;border:1px solid #25334a;border-radius:14px;padding:18px;margin-bottom:18px}
textarea{width:100%;min-height:90px;background:#080d18;color:#fff;border:1px solid #33445e;border-radius:10px;padding:12px;font-size:15px;resize:vertical}
button{margin-top:12px;background:#2563eb;color:#fff;border:0;border-radius:9px;padding:12px 20px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:12px;color:#9fb0c8}
.error{background:#35151a;border:1px solid #7f2935;color:#ffb5bd;padding:12px;border-radius:10px;margin-top:12px;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.card{background:#101827;border:1px solid #26364e;border-radius:14px;padding:18px;position:relative}
.rank{position:absolute;right:16px;top:14px;background:#1c2940;border-radius:20px;padding:5px 10px;color:#9fb2cc;font-size:12px}
.symbol{font-size:23px;font-weight:bold}
.price{font-size:27px;margin-top:8px}
.date{font-size:12px;color:#8191a8;margin-bottom:14px}
.signal{display:inline-block;padding:7px 11px;border-radius:8px;font-weight:bold;font-size:12px;margin-bottom:15px;background:#1d2940}
.signal.strong{background:#14532d;color:#bbf7d0}
.signal.buy{background:#164e63;color:#a5f3fc}
.signal.watch{background:#713f12;color:#fde68a}
.signal.neutral{background:#263244;color:#cbd5e1}
.signal.avoid{background:#4c1d1d;color:#fecaca}
.score{font-size:18px;font-weight:bold;margin-bottom:14px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #1d293b;padding:8px 0;gap:15px}
.row span:first-child{color:#8fa0b8}
.row span:last-child{text-align:right;font-weight:bold}
.good{color:#5ee6a8}
.bad{color:#ff8585}
.neutralc{color:#ffd166}
.proj{margin-top:15px;padding:12px;background:#0b1220;border-radius:10px}
.projtitle{color:#8fa0b8;font-size:12px;margin-bottom:7px}
.projrange{font-size:18px;font-weight:bold}
.small{font-size:12px;color:#8291a7;margin-top:5px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px;border-bottom:1px solid #25334a;text-align:left}
th{color:#8fa0b8;font-size:12px}
.tablewrap{overflow:auto}
.legend{font-size:12px;color:#8090a6;margin-top:12px}
@media(max-width:600px){
.wrap{padding:12px}
h1{font-size:24px}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="wrap">

<h1>Weekly Range Scanner PRO</h1>
<div class="sub">Scanner de rango semanal, volumen, tendencia y oportunidades Swing</div>

<div class="panel">
<textarea id="symbols">NVDA,META,AMZN,GOOGL,UBER,NFLX,QQQM,PLTR</textarea>
<button id="btn" onclick="analyze()">ANALIZAR</button>
<div id="status" class="status">Máximo 8 símbolos por análisis. MSFT se excluye automáticamente.</div>
<div id="error" class="error"></div>
</div>

<div id="results"></div>

</div>

<script>
const API="https://weekly-range-api.changowalu.workers.dev";

const $=id=>document.getElementById(id);

function num(v){
  if(v===null||v===undefined)return NaN;
  if(typeof v==="number")return v;
  let s=String(v).trim().replace(/,/g,"");
  s=s.replace(/\s+/g,"");
  return Number(s);
}

function field(o,names){
  for(const n of names){
    if(o[n]!==undefined)return o[n];
  }
  const keys=Object.keys(o);
  for(const n of names){
    const k=keys.find(x=>x.toLowerCase()===n.toLowerCase());
    if(k!==undefined)return o[k];
  }
  return undefined;
}

function normalizeValues(values){
  if(!Array.isArray(values))return[];

  const out=values.map(x=>{
    const d=field(x,["datetime","date","fecha y hora","fecha_hora"]);
    const open=num(field(x,["open","apertura"]));
    const high=num(field(x,["high","máximo","maximo"]));
    const low=num(field(x,["low","mínimo","minimo","bajo"]));
    const close=num(field(x,["close","cierre"]));
    const volume=num(field(x,["volume","volumen"]));

    return {
      date:String(d||""),
      open,high,low,close,volume
    };
  }).filter(x=>
    x.date &&
    Number.isFinite(x.open) &&
    Number.isFinite(x.high) &&
    Number.isFinite(x.low) &&
    Number.isFinite(x.close)
  );

  out.sort((a,b)=>new Date(a.date)-new Date(b.date));

  const unique=[];
  const seen=new Set();

  for(const x of out){
    if(!seen.has(x.date)){
      seen.add(x.date);
      unique.push(x);
    }
  }

  return unique;
}

function ema(values,len){
  if(values.length<len)return NaN;

  const k=2/(len+1);
  let e=values.slice(0,len).reduce((a,b)=>a+b,0)/len;

  for(let i=len;i<values.length;i++){
    e=values[i]*k+e*(1-k);
  }
  return e;
}

function avg(a){
  const v=a.filter(Number.isFinite);
  return v.length?v.reduce((x,y)=>x+y,0)/v.length:NaN;
}

function std(a){
  const v=a.filter(Number.isFinite);
  if(v.length<2)return NaN;
  const m=avg(v);
  return Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/(v.length-1));
}

function pct(a,b){
  return b?((a/b)-1)*100:NaN;
}

function money(x){
  return Number.isFinite(x)
    ? "$"+x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})
    : "N/D";
}

function percent(x){
  return Number.isFinite(x)
    ? x.toFixed(2)+"%"
    : "N/D";
}

function xfmt(x){
  return Number.isFinite(x)?x.toFixed(2)+"x":"N/D";
}

function getWeekKey(date){
  const d=new Date(date+"T12:00:00");
  const day=d.getDay();
  const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function weeklyData(data){
  const map={};

  for(const d of data){
    const key=getWeekKey(d.date);

    if(!map[key]){
      map[key]={
        week:key,
        high:d.high,
        low:d.low,
        close:d.close
      };
    }else{
      map[key].high=Math.max(map[key].high,d.high);
      map[key].low=Math.min(map[key].low,d.low);
      map[key].close=d.close;
    }
  }

  return Object.values(map).sort((a,b)=>a.week.localeCompare(b.week));
}

function currentWeek(data){
  if(!data.length)return null;
  const key=getWeekKey(data[data.length-1].date);
  const rows=data.filter(x=>getWeekKey(x.date)===key);

  if(!rows.length)return null;

  return{
    week:key,
    high:Math.max(...rows.map(x=>x.high)),
    low:Math.min(...rows.map(x=>x.low)),
    close:rows[rows.length-1].close
  };
}

function calcAWR(weeks,n){
  if(weeks.length<n+1)return NaN;

  const completed=weeks.slice(0,-1);
  const selected=completed.slice(-n);

  return avg(selected.map(x=>x.high-x.low));
}

function rvol20(data){
  if(data.length<21)return NaN;

  const current=data[data.length-1].volume;
  const previous=data.slice(-21,-1).map(x=>x.volume).filter(Number.isFinite);

  if(!Number.isFinite(current)||!previous.length)return NaN;

  return current/avg(previous);
}

function volumeTrend(data){
  if(data.length<11)return 0;

  const recent=avg(data.slice(-5).map(x=>x.volume));
  const old=avg(data.slice(-10,-5).map(x=>x.volume));

  if(!Number.isFinite(recent)||!Number.isFinite(old)||!old)return 0;

  return ((recent/old)-1)*100;
}

function priceMomentum(data){
  if(data.length<21)return NaN;

  const now=data[data.length-1].close;
  const old=data[data.length-21].close;

  return pct(now,old);
}

function rangePosition(w){
  if(!w)return NaN;
  const range=w.high-w.low;
  if(!range)return 50;
  return ((w.close-w.low)/range)*100;
}

function scoreEngine(d){
  let trend=0;
  let momentum=0;
  let volume=0;
  let range=0;
  let structure=0;

  const{
    price,e20,e50,e200,
    rvol,momentumPct,
    currentRange,awr4,awr8,awr12,
    position,volTrend
  }=d;

  if(price>e20)trend+=10;
  if(e20>e50)trend+=10;
  if(e50>e200)trend+=10;

  if(momentumPct>8)momentum=20;
  else if(momentumPct>4)momentum=16;
  else if(momentumPct>1)momentum=11;
  else if(momentumPct>-2)momentum=6;
  else momentum=2;

  if(rvol>=1.5)volume+=15;
  else if(rvol>=1.2)volume+=12;
  else if(rvol>=1.0)volume+=9;
  else if(rvol>=0.85)volume+=5;

  if(volTrend>15)volume+=5;
  else if(volTrend>5)volume+=3;

  if(Number.isFinite(awr4)&&awr4>0){
    const ratio=currentRange/awr4;

    if(ratio>=0.8&&ratio<=1.4)range+=8;
    else if(ratio<0.8)range+=5;
    else range+=2;
  }

  if(Number.isFinite(awr4)&&Number.isFinite(awr8)&&Number.isFinite(awr12)){
    if(awr4>awr8&&awr8>awr12)range+=7;
    else if(awr4>=awr12)range+=4;
  }

  if(position>=55&&position<=90)structure+=8;
  else if(position>90)structure+=4;
  else if(position>=40)structure+=5;

  if(price>e50)structure+=4;
  if(price>e200)structure+=3;

  let total=trend+momentum+volume+range+structure;

  total=Math.max(0,Math.min(100,Math.round(total)));

  return{
    score:total,
    trend,
    momentum,
    volume,
    range,
    structure
  };
}

function signal(score,d){
  if(score>=80)return["STRONG BUY","strong"];
  if(score>=65)return["BUY","buy"];
  if(score>=50)return["WATCH","watch"];
  if(score>=35)return["NEUTRAL","neutral"];
  return["AVOID","avoid"];
}

function trendText(price,e20,e50,e200){
  if(price>e20&&e20>e50&&e50>e200)return["BULLISH","good"];
  if(price<e20&&e20<e50&&e50<e200)return["BEARISH","bad"];
  return["NEUTRAL","neutralc"];
}

function makeAnalysis(symbol,raw){
  let values=raw?.values||raw?.data||raw?.datos;

  if(!Array.isArray(values)){
    if(Array.isArray(raw))values=raw;
    else return null;
  }

  const data=normalizeValues(values);

  if(data.length<200)return null;

  const closes=data.map(x=>x.close);

  const last=data[data.length-1];

  const price=last.close;

  const e20=ema(closes,20);
  const e50=ema(closes,50);
  const e200=ema(closes,200);

  const weeks=weeklyData(data);
  const cw=currentWeek(data);

  const currentRange=cw?cw.high-cw.low:NaN;
  const currentRangePct=cw?pct(cw.high,cw.low):NaN;

  const awr4=calcAWR(weeks,4);
  const awr8=calcAWR(weeks,8);
  const awr12=calcAWR(weeks,12);

  const rvol=rvol20(data);
  const volTrend=volumeTrend(data);
  const momentumPct=priceMomentum(data);
  const position=rangePosition(cw);

  const trend=trendText(price,e20,e50,e200);

  const base=avg([awr4,awr8,awr12].filter(Number.isFinite));

  let projected=base;

  if(Number.isFinite(projected)&&Number.isFinite(rvol)){
    projected*=Math.max(.75,Math.min(1.75,Math.sqrt(rvol)));
  }

  if(!Number.isFinite(projected))projected=NaN;

  const deviation=Number.isFinite(projected)?projected/2:NaN;

  const bullTarget=Number.isFinite(deviation)?price+deviation:NaN;
  const bearTarget=Number.isFinite(deviation)?price-deviation:NaN;

  const scoreData=scoreEngine({
    price,e20,e50,e200,rvol,momentumPct,
    currentRange,awr4,awr8,awr12,
    position,volTrend
  });

  const sig=signal(scoreData.score,{
    trend:trend[0]
  });

  return{
    symbol,
    price,
    date:last.date,
    currentRange,
    currentRangePct,
    awr4,awr8,awr12,
    rvol,
    e20,e50,e200,
    trend,
    momentumPct,
    volTrend,
    position,
    projected,
    bullTarget,
    bearTarget,
    ...scoreData,
    signal:sig[0],
    signalClass:sig[1]
  };
}

async function fetchData(symbols){
  const url=API+"/api?symbols="+encodeURIComponent(symbols.join(","));

  const response=await fetch(url,{cache:"no-store"});

  const text=await response.text();

  let json;

  try{
    json=JSON.parse(text);
  }catch{
    throw new Error("El Worker devolvió una respuesta que no es JSON.");
  }

  if(!response.ok||json.status==="error"){
    throw new Error(json.message||"Error del Worker.");
  }

  return json;
}

function card(d,index){
  return`
  <div class="card">
    <div class="rank">#${index+1}</div>

    <div class="symbol">${d.symbol}</div>
    <div class="price">${money(d.price)}</div>
    <div class="date">Precio de ${d.date}</div>

    <div class="signal ${d.signalClass}">${d.signal}</div>

    <div class="score">SWING SCORE: ${d.score}/100</div>

    <div class="row">
      <span>Tendencia</span>
      <span class="${d.trend[1]}">${d.trend[0]}</span>
    </div>

    <div class="row">
      <span>Momentum 20D</span>
      <span>${percent(d.momentumPct)}</span>
    </div>

    <div class="row">
      <span>RVOL 20D</span>
      <span>${xfmt(d.rvol)}</span>
    </div>

    <div class="row">
      <span>Volumen reciente</span>
      <span>${percent(d.volTrend)}</span>
    </div>

    <div class="row">
      <span>Rango semanal</span>
      <span>${money(d.currentRange)}</span>
    </div>

    <div class="row">
      <span>% rango semanal</span>
      <span>${percent(d.currentRangePct)}</span>
    </div>

    <div class="row">
      <span>Posición en rango</span>
      <span>${percent(d.position)}</span>
    </div>

    <div class="row">
      <span>AWR 4S</span>
      <span>${money(d.awr4)}</span>
    </div>

    <div class="row">
      <span>AWR 8S</span>
      <span>${money(d.awr8)}</span>
    </div>

    <div class="row">
      <span>AWR 12S</span>
      <span>${money(d.awr12)}</span>
    </div>

    <div class="row">
      <span>EMA 20</span>
      <span>${money(d.e20)}</span>
    </div>

    <div class="row">
      <span>EMA 50</span>
      <span>${money(d.e50)}</span>
    </div>

    <div class="row">
      <span>EMA 200</span>
      <span>${money(d.e200)}</span>
    </div>

    <div class="proj">
      <div class="projtitle">MOVIMIENTO PROYECTADO</div>
      <div class="projrange">
        ${money(d.bearTarget)} → ${money(d.bullTarget)}
      </div>
      <div class="small">
        Movimiento estimado: ${money(d.projected)}
        · ±${Number.isFinite(d.projected)?((d.projected/d.price)*100/2).toFixed(2):"N/D"}%
      </div>
    </div>
  </div>`;
}

function table(rows){
  return`
  <div class="panel">
    <h2>Ranking de oportunidades</h2>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>SÍMBOLO</th>
            <th>SCORE</th>
            <th>SEÑAL</th>
            <th>PRECIO</th>
            <th>TENDENCIA</th>
            <th>RVOL</th>
            <th>MOMENTUM</th>
            <th>RANGO</th>
            <th>PROYECCIÓN</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((d,i)=>`
          <tr>
            <td>${i+1}</td>
            <td><b>${d.symbol}</b></td>
            <td><b>${d.score}</b></td>
            <td>${d.signal}</td>
            <td>${money(d.price)}</td>
            <td>${d.trend[0]}</td>
            <td>${xfmt(d.rvol)}</td>
            <td>${percent(d.momentumPct)}</td>
            <td>${percent(d.currentRangePct)}</td>
            <td>${money(d.bearTarget)} → ${money(d.bullTarget)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <div class="legend">
      SCORE ≥80 = STRONG BUY · ≥65 = BUY · ≥50 = WATCH ·
      ≥35 = NEUTRAL · &lt;35 = AVOID
    </div>
  </div>`;
}

async function analyze(){

  const btn=$("btn");
  const status=$("status");
  const error=$("error");
  const results=$("results");

  error.style.display="none";
  error.textContent="";
  results.innerHTML="";

  let symbols=$("symbols").value
    .split(/[\s,;]+/)
    .map(x=>x.trim().toUpperCase())
    .filter(Boolean)
    .filter(x=>x!=="MSFT");

  symbols=[...new Set(symbols)].slice(0,8);

  if(!symbols.length){
    error.textContent="Introduce al menos un símbolo.";
    error.style.display="block";
    return;
  }

  btn.disabled=true;
  btn.textContent="ANALIZANDO...";
  status.textContent="Descargando datos reales y calculando indicadores...";

  try{

    const response=await fetchData(symbols);

    const source=response.data||response;

    const rows=[];

    for(const symbol of symbols){

      let raw=source[symbol];

      if(!raw){
        const key=Object.keys(source).find(
          x=>x.toUpperCase()===symbol
        );
        if(key)raw=source[key];
      }

      if(!raw)continue;

      const result=makeAnalysis(symbol,raw);

      if(result)rows.push(result);
    }

    rows.sort((a,b)=>b.score-a.score);

    if(!rows.length){
      throw new Error(
        "No se pudieron calcular los indicadores. Los datos recibidos no contienen suficientes barras válidas."
      );
    }

    results.innerHTML=
      table(rows)+
      `<div class="grid">${rows.map(card).join("")}</div>`;

    const used=response.creditsUsed??"N/D";
    const left=response.creditsLeft??"N/D";

    status.textContent=
      `Análisis terminado: ${rows.length}/${symbols.length} símbolos procesados. `+
      `· Actualizado: ${new Date().toLocaleString()} `+
      `· Créditos usados: ${used} · Créditos restantes: ${left}`;

  }catch(e){

    error.textContent=e.message||String(e);
    error.style.display="block";

    status.textContent="No se pudo completar el análisis.";

  }finally{

    btn.disabled=false;
    btn.textContent="ANALIZAR";

  }
}
</script>

</body>
</html>
